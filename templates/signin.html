{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Mountain Retreat Lodge</title>
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>
<body class="auth-body" style="background: linear-gradient(135deg, #1b263b, #415a77); height: 100vh; display: flex; justify-content: center; align-items: center;">
    <div class="auth-container" style="background: #ffffff; padding: 2.5rem; border-radius: 8px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center;">
        <h2 style="margin-bottom: 1.5rem; color: #1b263b;">Welcome Back</h2>
        
        {% if messages %}
            {% for message in messages %}
                <p style="color: #d90429; background: #ffe5e5; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.85rem;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST" class="auth-form">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Email Address" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px;">
            <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 0.75rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px;">
            <button type="submit" style="width: 100%; padding: 0.75rem; background-color: #1b263b; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Sign In</button>
        </form>
        <p style="margin-top: 1rem; font-size: 0.9rem;">Don't have an account? <a href="{% url 'signup' %}" style="color: #4ea8de; text-decoration: none;">Sign Up</a></p>
    </div>
</body>
</html>
